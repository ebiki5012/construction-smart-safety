<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>건설현장 스마트 안전관리</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f7fb;color:#172033;font-family:Arial,"Malgun Gothic",sans-serif}button,input,select,textarea{font:inherit}button{border:0;border-radius:9px;padding:10px 14px;background:#205cf5;color:#fff;cursor:pointer}input,select,textarea{width:100%;border:1px solid #d9dfeb;border-radius:9px;padding:10px;background:#fff}textarea{min-height:90px}.hidden{display:none!important}.login{min-height:100vh;display:grid;place-items:center}.loginbox{background:#fff;padding:32px;border-radius:20px;width:420px;max-width:92%;box-shadow:0 20px 70px #00000012}.app{display:grid;grid-template-columns:250px 1fr;min-height:100vh}.side{background:#111827;color:#fff;padding:22px}.brand{font-size:19px;font-weight:800;margin-bottom:25px}.nav button{width:100%;display:block;text-align:left;background:transparent;margin:4px 0;color:#dbe4f0}.nav button.on{background:#205cf5}.main{padding:26px;max-width:1500px;width:100%;margin:auto}.top{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:22px}.title{font-size:26px;font-weight:800}.site-select{max-width:360px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card{background:#fff;border:1px solid #e8ecf2;border-radius:15px;padding:18px}.stat{font-size:30px;font-weight:800;margin-top:5px}.muted{color:#728096;font-size:13px}.section{margin-top:18px}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.form{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.full{grid-column:1/-1}.table{overflow:auto;background:#fff;border:1px solid #e8ecf2;border-radius:13px}table{width:100%;border-collapse:collapse;min-width:850px}th,td{padding:11px;border-bottom:1px solid #edf0f4;text-align:left;font-size:13px}th{background:#fafbfd}.badge{display:inline-block;border-radius:999px;padding:4px 8px;font-size:11px;font-weight:800}.hi{background:#fee2e2;color:#b91c1c}.mi{background:#fef3c7;color:#92400e}.lo{background:#dcfce7;color:#166534}.toast{position:fixed;right:20px;bottom:20px;background:#111827;color:#fff;padding:12px 16px;border-radius:10px;display:none}.tabs{display:flex;gap:8px;margin-bottom:14px}.tabs button{background:#e9eef8;color:#27334a}.tabs button.on{background:#205cf5;color:#fff}.modal{position:fixed;inset:0;background:#0007;display:grid;place-items:center;padding:20px}.modalbox{background:#fff;border-radius:15px;padding:22px;width:520px;max-width:95%}
@media(max-width:900px){.app{grid-template-columns:1fr}.grid{grid-template-columns:repeat(2,1fr)}.form{grid-template-columns:1fr}}
</style></head><body>
<div id="login" class="login"><div class="loginbox"><h2>🏗️ 건설현장 스마트 안전관리</h2><p class="muted">현장별 공유형 위험성평가 · TBM · 조치관리</p>
<form id="lf"><p><label>아이디</label><input id="email" value="admin@site.local"></p><p><label>비밀번호</label><input id="pw" type="password" value="admin1234"></p><button style="width:100%">로그인</button></form><p class="muted">초기 관리자: admin@site.local / admin1234</p></div></div>
<div id="app" class="app hidden"><aside class="side"><div class="brand">🏗️ 스마트 안전관리</div><div id="who" class="muted"></div><div class="nav">
<button data-p="dashboard" class="on">📊 대시보드</button><button data-p="risk">⚠️ 위험성평가</button><button data-p="template">📚 표준평가</button><button data-p="tbm">📝 TBM</button><button data-p="action">🔧 조치관리</button><button id="adminNav" data-p="admin">⚙️ 관리자</button></div><button id="logout" style="margin-top:25px;width:100%;background:#374151">로그아웃</button></aside>
<main class="main"><div class="top"><div><div id="pt" class="title">대시보드</div><div class="muted">현장별 데이터가 분리되어 관리됩니다.</div></div><select id="site" class="site-select"></select></div>
<section id="dashboard" class="page"><div class="grid"><div class="card"><div class="muted">위험성평가</div><div id="sr" class="stat">0</div></div><div class="card"><div class="muted">고위험</div><div id="sh" class="stat">0</div></div><div class="card"><div class="muted">미조치</div><div id="sa" class="stat">0</div></div><div class="card"><div class="muted">오늘 TBM</div><div id="st" class="stat">0</div></div></div><div class="section card"><h3>현재 현장</h3><div id="siteInfo"></div></div></section>
<section id="risk" class="page hidden"><div class="card"><h3>위험성평가</h3><div class="form"><div><label>작성일</label><input id="rd" type="date"></div><div><label>공종/구역</label><input id="ra"></div><div><label>작업명</label><input id="rw"></div><div><label>위험요인</label><input id="rh"></div><div><label>빈도</label><select id="rf"></select></div><div><label>강도</label><select id="rs"></select></div><div class="full"><label>감소대책</label><textarea id="rm"></textarea></div></div><button onclick="saveRisk()">저장</button></div><div class="section"><div class="head"><h3>평가 목록</h3><button onclick="loadRisks()">새로고침</button></div><div id="riskTable" class="table"></div></div></section>
<section id="template" class="page hidden"><div class="card"><h3>표준 위험성평가</h3><p class="muted">반복 작업은 표준평가로 저장해 두고 다시 불러올 수 있습니다.</p><div id="templates"></div></div></section>
<section id="tbm" class="page hidden"><div class="card"><h3>TBM</h3><div class="form"><div><label>일자</label><input id="td" type="date"></div><div><label>팀/업체</label><input id="tt"></div><div><label>작업명</label><input id="tw"></div><div><label>인원</label><input id="tp" type="number" value="5"></div><div class="full"><label>연결 위험성평가</label><select id="tr"></select></div><div class="full"><label>위험요인</label><textarea id="th"></textarea></div><div class="full"><label>감소대책</label><textarea id="tm"></textarea></div></div><button onclick="saveTbm()">TBM 저장</button></div><div class="section"><div id="tbmTable" class="table"></div></div></section>
<section id="action" class="page hidden"><div class="card"><h3>조치사항</h3><div class="form"><div><label>조치내용</label><input id="ai"></div><div><label>담당자</label><input id="am"></div><div><label>조치기한</label><input id="ad" type="date"></div><div><label>연결 위험성평가</label><select id="ar"></select></div></div><button onclick="saveAction()">등록</button></div><div class="section"><div id="actionTable" class="table"></div></div></section>
<section id="admin" class="page hidden"><div class="tabs"><button class="on" data-tab="sitesTab">현장관리</button><button data-tab="usersTab">사용자관리</button><button data-tab="settingsTab">위험성평가 설정</button></div>
<div id="sitesTab" class="adminTab"><div class="card"><h3>현장 관리</h3><div class="form"><div><label>현장명</label><input id="sn"></div><div><label>주소</label><input id="saddr"></div><div><label>착공일</label><input id="ss" type="date"></div><div><label>준공예정일</label><input id="se" type="date"></div></div><button onclick="addSite()">현장 추가</button></div><div class="section"><div id="siteTable" class="table"></div></div></div>
<div id="usersTab" class="adminTab hidden"><div class="card"><h3>사용자 추가</h3><div class="form"><div><label>이름</label><input id="un"></div><div><label>이메일</label><input id="ue"></div><div><label>임시 비밀번호</label><input id="up" value="12345678"></div><div><label>권한</label><select id="ur"><option value="USER">사용자</option><option value="MANAGER">현장관리자</option><option value="ADMIN">최고관리자</option></select></div><div><label>배정 현장</label><select id="us"></select></div></div><button onclick="addUser()">사용자 추가</button></div><div class="section"><div id="userTable" class="table"></div></div></div>
<div id="settingsTab" class="adminTab hidden"><div class="card"><h3>현장별 위험성평가 기준</h3><div class="form"><div><label>빈도 1</label><input id="f1"></div><div><label>빈도 2</label><input id="f2"></div><div><label>빈도 3</label><input id="f3"></div><div><label>강도 1</label><input id="v1"></div><div><label>강도 2</label><input id="v2"></div><div><label>강도 3</label><input id="v3"></div><div><label>낮음 최대점수</label><input id="low" type="number"></div><div><label>보통 최대점수</label><input id="mid" type="number"></div></div><button onclick="saveSettings()">설정 저장</button><p class="muted">예: 3×3 기준이면 낮음 3 / 보통 5 / 그 이상 높음.</p></div></div>
</section></main></div><div id="toast" class="toast"></div>
<script>
let me,sites=[],sid="";
const $=x=>document.getElementById(x),today=()=>new Date().toISOString().slice(0,10);
async function api(u,o={}){let r=await fetch(u,{headers:{"Content-Type":"application/json"},...o}),d=await r.json();if(!r.ok)throw Error(d.error||"오류");return d}
function toast(x){$("toast").textContent=x;$("toast").style.display="block";setTimeout(()=>$("toast").style.display="none",2000)}
function badge(l){return `<span class="badge ${l==="높음"?"hi":l==="보통"?"mi":"lo"}">${l}</span>`}
async function init(){try{me=(await api("/api/me")).user;sites=await api("/api/sites");$("login").classList.add("hidden");$("app").classList.remove("hidden");$("who").textContent=me.name+" · "+me.role;if(me.role!=="ADMIN")$("adminNav").classList.add("hidden");$("site").innerHTML=sites.map(s=>`<option value="${s.id}">${s.name}</option>`).join("");sid=sites[0]?.id||"";$("site").value=sid;$("site").onchange=()=>{sid=$("site").value;show("dashboard")};$("rd").value=today();$("td").value=today();show("dashboard")}catch(e){}}
function show(p){document.querySelectorAll(".page").forEach(x=>x.classList.add("hidden"));$(p).classList.remove("hidden");document.querySelectorAll(".nav button").forEach(b=>b.classList.toggle("on",b.dataset.p===p));$("pt").textContent={dashboard:"대시보드",risk:"위험성평가",template:"표준평가",tbm:"TBM",action:"조치관리",admin:"관리자"}[p];if(p==="dashboard")loadDash();if(p==="risk"){loadSettings();loadRisks()}if(p==="template")loadTemplates();if(p==="tbm"){loadRisks();loadTbms()}if(p==="action"){loadRisks();loadActions()}if(p==="admin")loadAdmin()}
document.querySelectorAll(".nav button").forEach(b=>b.onclick=()=>show(b.dataset.p));$("lf").onsubmit=async e=>{e.preventDefault();try{await api("/api/login",{method:"POST",body:JSON.stringify({email:$("email").value,password:$("pw").value})});location.reload()}catch(e){toast(e.message)}};$("logout").onclick=async()=>{await api("/api/logout",{method:"POST"});location.reload()}
async function loadDash(){let d=await api(`/api/dashboard?site_id=${sid}`);$("sr").textContent=d.riskCount;$("sh").textContent=d.highRiskCount;$("sa").textContent=d.actionOpen;$("st").textContent=d.todayTbm;let s=sites.find(x=>x.id==sid);$("siteInfo").innerHTML=s?`<b>${s.name}</b><div class="muted">${s.address||""} · ${s.status}</div>`:"현장을 선택하세요."}
async function loadSettings(){let s=await api(`/api/settings?site_id=${sid}`);let f=s.frequency_labels,v=s.severity_labels;$("rf").innerHTML=[1,2,3].map(i=>`<option value="${i}">${i} · ${f[i]}</option>`).join("");$("rs").innerHTML=[1,2,3].map(i=>`<option value="${i}">${i} · ${v[i]}</option>`).join("")}
async function loadRisks(){let r=await api(`/api/risks?site_id=${sid}`);$("riskTable").innerHTML=r.length?`<table><tr><th>일자</th><th>구역</th><th>작업</th><th>위험요인</th><th>빈도</th><th>강도</th><th>점수</th><th>등급</th><th>대책</th><th></th></tr>${r.map(x=>`<tr><td>${x.risk_date?.slice(0,10)||""}</td><td>${x.area||""}</td><td>${x.work||""}</td><td>${x.hazard||""}</td><td>${x.frequency}</td><td>${x.severity}</td><td><b>${x.score}</b></td><td>${badge(x.level)}</td><td>${x.measure||""}</td><td><button onclick="toTpl(${x.id})">표준평가 저장</button></td></tr>`).join("")}</table>`:`<div style="padding:30px;text-align:center" class="muted">등록된 평가가 없습니다.</div>`;let opt=`<option value="">선택 안 함</option>`+r.map(x=>`<option value="${x.id}">${x.work||""} / ${x.hazard||""}</option>`).join("");$("tr").innerHTML=opt;$("ar").innerHTML=opt}
async function saveRisk(){try{let x=await api("/api/risks",{method:"POST",body:JSON.stringify({site_id:sid,date:$("rd").value,area:$("ra").value,work:$("rw").value,hazard:$("rh").value,frequency:$("rf").value,severity:$("rs").value,measure:$("rm").value})});toast(`저장 완료 · ${x.score}점 ${x.level}`);loadRisks();loadDash()}catch(e){toast(e.message)}}
async function toTpl(id){let r=(await api(`/api/risks?site_id=${sid}`)).find(x=>x.id===id);await api("/api/templates",{method:"POST",body:JSON.stringify({site_id:sid,name:(r.work||"작업")+" 표준평가",area:r.area,work:r.work,hazard:r.hazard,frequency:r.frequency,severity:r.severity,measure:r.measure})});toast("표준평가로 저장했습니다.")}
async function loadTemplates(){let t=await api(`/api/templates?site_id=${sid}`);$("templates").innerHTML=t.length?t.map(x=>`<div class="card" style="margin:10px 0;border:1px solid #e5eaf2"><b>${x.name}</b><div class="muted">${x.area||""} · ${x.work||""} · ${x.hazard||""}</div><div>위험도 ${x.score}점 ${badge(x.level)}</div><p>${x.measure||""}</p><button onclick='useTpl(${JSON.stringify(x)})'>불러오기</button></div>`).join(""):`<div class="muted">표준평가가 없습니다.</div>`}
function useTpl(x){show("risk");$("ra").value=x.area||"";$("rw").value=x.work||"";$("rh").value=x.hazard||"";$("rf").value=x.frequency;$("rs").value=x.severity;$("rm").value=x.measure||"";toast("표준평가를 불러왔습니다.")}
$("tr").onchange=async()=>{if(!$("tr").value){$("th").value="";$("tm").value="";return}let r=(await api(`/api/risks?site_id=${sid}`)).find(x=>x.id==$("tr").value);$("th").value=r?.hazard||"";$("tm").value=r?.measure||""}
async function saveTbm(){try{await api("/api/tbms",{method:"POST",body:JSON.stringify({site_id:sid,tbm_date:$("td").value,team:$("tt").value,work_name:$("tw").value,people:$("tp").value,risk_id:$("tr").value,hazard:$("th").value,measure:$("tm").value})});toast("TBM 저장");loadTbms();loadDash()}catch(e){toast(e.message)}}
async function loadTbms(){let t=await api(`/api/tbms?site_id=${sid}`);$("tbmTable").innerHTML=t.length?`<table><tr><th>일자</th><th>팀</th><th>작업</th><th>인원</th><th>위험요인</th><th>대책</th></tr>${t.map(x=>`<tr><td>${x.tbm_date?.slice(0,10)||""}</td><td>${x.team||""}</td><td>${x.work_name||""}</td><td>${x.people}</td><td>${x.hazard||""}</td><td>${x.measure||""}</td></tr>`).join("")}</table>`:`<div class="muted">TBM 기록이 없습니다.</div>`}
async function saveAction(){try{await api("/api/actions",{method:"POST",body:JSON.stringify({site_id:sid,item:$("ai").value,manager:$("am").value,due_date:$("ad").value,risk_id:$("ar").value})});toast("조치사항 등록");loadActions();loadDash()}catch(e){toast(e.message)}}
async function loadActions(){let a=await api(`/api/actions?site_id=${sid}`);$("actionTable").innerHTML=a.length?`<table><tr><th>조치내용</th><th>담당자</th><th>기한</th><th>상태</th><th></th></tr>${a.map(x=>`<tr><td>${x.item||""}</td><td>${x.manager||""}</td><td>${x.due_date?.slice(0,10)||"-"}</td><td>${x.status==="DONE"?badge("낮음"):"<span class='badge hi'>미조치</span>"}</td><td>${x.status==="DONE"?"완료":`<button onclick="done(${x.id})">완료</button>`}</td></tr>`).join("")}</table>`:`<div class="muted">조치사항이 없습니다.</div>`}
async function done(id){await api(`/api/actions/${id}`,{method:"PATCH",body:JSON.stringify({status:"DONE"})});toast("완료 처리");loadActions();loadDash()}
async function loadAdmin(){loadSites();loadUsers();loadSettingAdmin();$("us").innerHTML=sites.map(s=>`<option value="${s.id}">${s.name}</option>`).join("")}
document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{document.querySelectorAll(".tabs button").forEach(x=>x.classList.remove("on"));b.classList.add("on");document.querySelectorAll(".adminTab").forEach(x=>x.classList.add("hidden"));$(b.dataset.tab).classList.remove("hidden")});
async function loadSites(){let s=await api("/api/sites");$("siteTable").innerHTML=`<table><tr><th>현장</th><th>주소</th><th>기간</th><th>상태</th><th></th></tr>${s.map(x=>`<tr><td>${x.name}</td><td>${x.address||""}</td><td>${x.start_date?.slice(0,10)||""} ~ ${x.end_date?.slice(0,10)||""}</td><td>${x.status}</td><td><button onclick='editSite(${JSON.stringify(x)})'>수정</button></td></tr>`).join("")}</table>`}
async function addSite(){try{await api("/api/sites",{method:"POST",body:JSON.stringify({name:$("sn").value,address:$("saddr").value,start_date:$("ss").value,end_date:$("se").value})});toast("현장 추가");sites=await api("/api/sites");$("site").innerHTML=sites.map(s=>`<option value="${s.id}">${s.name}</option>`).join("");sid=sites[0].id;loadSites()}catch(e){toast(e.message)}}
async function editSite(s){let name=prompt("현장명",s.name);if(name===null)return;let status=prompt("상태(진행중/완료/중지)",s.status);if(status===null)return;await api(`/api/sites/${s.id}`,{method:"PATCH",body:JSON.stringify({...s,name,status})});toast("현장 정보 수정");sites=await api("/api/sites");$("site").innerHTML=sites.map(x=>`<option value="${x.id}">${x.name}</option>`).join("");sid=s.id;loadSites();loadDash()}
async function loadUsers(){let u=await api("/api/users");$("userTable").innerHTML=`<table><tr><th>이름</th><th>이메일</th><th>권한</th><th>활성</th><th>현장</th></tr>${u.map(x=>`<tr><td>${x.name}</td><td>${x.email}</td><td>${x.role}</td><td>${x.active?"사용":"중지"}</td><td>${x.sites.map(s=>s.site_name+" ("+s.site_role+")").join(", ")}</td></tr>`).join("")}</table>`}
async function addUser(){try{await api("/api/users",{method:"POST",body:JSON.stringify({name:$("un").value,email:$("ue").value,password:$("up").value,role:$("ur").value,site_id:$("us").value})});toast("사용자 추가");loadUsers()}catch(e){toast(e.message)}}
async function loadSettingAdmin(){let s=await api(`/api/settings?site_id=${sid}`),f=s.frequency_labels,v=s.severity_labels;$("f1").value=f[1];$("f2").value=f[2];$("f3").value=f[3];$("v1").value=v[1];$("v2").value=v[2];$("v3").value=v[3];$("low").value=s.low_max;$("mid").value=s.medium_max}
async function saveSettings(){try{await api("/api/settings",{method:"PUT",body:JSON.stringify({site_id:sid,frequency_labels:{1:$("f1").value,2:$("f2").value,3:$("f3").value},severity_labels:{1:$("v1").value,2:$("v2").value,3:$("v3").value},low_max:$("low").value,medium_max:$("mid").value})});toast("현장별 평가 기준을 저장했습니다.");loadSettings()}catch(e){toast(e.message)}}
init();
</script></body></html>
